apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-hi-browser
  labels:
    app: tomcat-hi-browser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat-hi-browser
  template:
    metadata:
      labels:
        app: tomcat-hi-browser
    spec:
      containers:
        - name: tomcat-hi-browser
          image: image-registry.openshift-image-registry.svc:5000/tomcat-hi-browser/tomcat-hi-browser:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HIBROWSER_REFRESH_MINUTES
              value: "60"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
