apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-hi-browser
  labels:
    app: tomcat-hi-browser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat-hi-browser
  template:
    metadata:
      labels:
        app: tomcat-hi-browser
      annotations:
        openshift.io/required-scc: restricted-v2
    spec:
      containers:
        - name: tomcat-hi-browser
          image: quay.io/marrober/tomcat-hi-browser:3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
